apply plugin: 'com.android.application'

android {
    namespace 'com.hyperion.nextide'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.hyperion.nextide"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar']) 
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.alexvasilkov:gesture-views:2.6.0' 
    //implementation 'com.maltaisn:icondialog:2.0.2'
    // implementation 'com.github.devlight.navigationtabstrip:navigationtabstrip:1.0.4'  // Not available on JitPack
    implementation 'com.github.ithedan:Group_Horizontal-and-vertical-Scrolling:v1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}

